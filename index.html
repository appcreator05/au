<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cineflix Gateway</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
/* ===== Gateway Screen Styles ===== */
body {
  background-color: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: white;
}
.gateway-container {
  display: flex;
  flex-direction: column;
  gap: 25px;
  align-items: center;
  width: 100%;
  max-width: 400px;
  padding: 20px;
  box-sizing: border-box;
}
.top-logo {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 1px;
  color: #ff2a85;
  margin-bottom: 10px;
  text-align: center;
}
.btn-label {
  color: #888;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 8px;
  display: block;
}
.btn {
  position: relative;
  display: flex;
  align-items: center;
  width: 280px;
  height: 65px;
  color: white;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  overflow: hidden;
  border: 2px solid transparent;
  background-clip: padding-box, border-box;
  background-origin: padding-box, border-box;
  transition: transform 0.2s ease;
  margin: 0 auto;
}
.btn-purple {
  background-image: linear-gradient(#000, #000), linear-gradient(to right, #8a2be2, #f06292);
}
.btn-purple::before {
  content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 60px; border-radius: 50px;
  background: linear-gradient(to right, #8a2be2, #f06292); transition: width 0.8s; z-index: 1;
}
.btn-blue {
  background-image: linear-gradient(#000, #000), linear-gradient(to right, #00d2ff, #0072ff);
}
.btn-blue::before {
  content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 60px; border-radius: 50px;
  background: linear-gradient(to right, #00d2ff, #0072ff); transition: width 0.8s; z-index: 1;
}
.btn span { position: absolute; width: 100%; text-align: center; z-index: 2; pointer-events: none; }
.icon-circle {
  position: absolute; left: 6px; width: 51px; height: 51px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; z-index: 3; background: white; transition: transform 0.8s;
}
.chevron {
  width: 10px; height: 10px; border-top: 3px solid #000; border-right: 3px solid #000; transform: rotate(45deg); margin-right: 4px;
}
.btn.clicked .icon-circle { transform: translateX(212px); }
.btn.clicked::before { width: 100%; }

/* Activation Area */
.sub-container { width: 100%; max-width: 320px; }
.gen-box {
  background: #0d0d0d;
  border: 1px solid #222;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
}
#activateKey {
  width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #333;
  border-radius: 12px; background: #000; color: #fff; box-sizing: border-box; outline: none; font-size: 14px;
}
.btn-activate {
  background: linear-gradient(to right, #00c6ff, #0072ff); color: white; border: none;
  padding: 14px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px;
}

/* Custom Notification Overlay */
.custom-alert-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.9); display: flex; justify-content: center; align-items: center;
  z-index: 99999; visibility: hidden; opacity: 0; transition: all 0.3s ease;
}
.custom-alert-overlay.show-alert { visibility: visible; opacity: 1; }
.custom-alert-box {
  background: #111; border: 1px solid #333; width: 85%; max-width: 300px;
  padding: 30px 20px; border-radius: 20px; text-align: center; transform: scale(0.7);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin: auto;
}
.custom-alert-overlay.show-alert .custom-alert-box { transform: scale(1) !important; }
.custom-alert-msg { color: white; font-size: 16px; margin-bottom: 25px; line-height: 1.4; }
.custom-alert-btn {
  background: linear-gradient(to right, #ff2a85, #b80053); color: white;
  border: none; padding: 10px 40px; border-radius: 25px; font-weight: bold; cursor: pointer;
}

#loader {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black;
  display: flex; justify-content: center; align-items: center; z-index: 9999; color: white; font-size: 18px;
}
</style>
</head>
<body>

  <div id="loader">Checking Access...</div>

  <div class="gateway-container" id="gatewayContainer" style="display: none;">
      <div class="top-logo">Cineflix Movie App</div>
      
      <div>
          <span class="btn-label">Free Version With Ads</span>
          <div class="btn btn-purple" onclick="enterFreeVersion(this)">
              <span>Free Version</span>
              <div class="icon-circle"><div class="chevron"></div></div>
          </div>
      </div>
      
      <div>
          <span class="btn-label">Paid Version Without Ads</span>
          <div class="btn btn-blue" onclick="checkPaidAccess(this)">
              <span>Paid Version</span>
              <div class="icon-circle"><div class="chevron"></div></div>
          </div>
      </div>
      
      <div class="sub-container">
          <div class="gen-box">
              <p style="font-size:13px; color:#666; margin-bottom: 15px; text-align: left;">Enter your Subscription key to unlock premium.</p>
              <input autocomplete="off" type="text" id="activateKey" placeholder="Enter key here..." />
              <button id="activateBtn" class="btn-activate">Activate Now</button>
          </div>
      </div>
  </div>

  <div id="customAlert1" class="custom-alert-overlay">
      <div class="custom-alert-box">
          <div id="customAlertMessage" class="custom-alert-msg">Message</div>
          <button id="customAlertBtn" class="custom-alert-btn">OK</button>
      </div>
  </div>

  <script>
    let isPremiumUser = false; 
    const MAIN_APP_URL = "main.html";

    function showPremiumAlert(message) {
        var overlay = document.getElementById('customAlert1');
        document.getElementById('customAlertMessage').textContent = message;
        overlay.classList.add('show-alert');
        document.getElementById('customAlertBtn').onclick = function() { overlay.classList.remove('show-alert'); };
    }

    function enterFreeVersion(element) {
        element.classList.add('clicked');
        setTimeout(function() {
            window.location.href = MAIN_APP_URL + "?ads=true";
        }, 1000);
    }

    function checkPaidAccess(element) {
        if (isPremiumUser) {
            element.classList.add('clicked');
            setTimeout(function() { 
                window.location.href = MAIN_APP_URL + "?ads=false"; 
            }, 1000);
        } else {
            showPremiumAlert("Please activate your Subscription Key first to unlock Paid Version!");
        }
    }

    function startSystem() {
        var firebaseConfig = {
            apiKey: "AIzaSyCyDd6rCV7WaQe8sMF0Xmob3dpm6z6wEEQ",
            authDomain: "myapps-4a8eb.firebaseapp.com",
            databaseURL: "https://myapps-4a8eb-default-rtdb.firebaseio.com",
            projectId: "myapps-4a8eb",
        };

        var fallbackTimeout = setTimeout(function() {
            document.getElementById("loader").style.display = "none";
            document.getElementById("gatewayContainer").style.display = "flex";
        }, 3000);

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            var db = firebase.database();

            function getDeviceId() {
                var id = localStorage.getItem("device_id") || "dev_" + Math.random().toString(36).substr(2,12);
                localStorage.setItem("device_id", id);
                return id;
            }
            var DEVICE_ID = getDeviceId();

            db.ref("subscriptions").once("value").then(function(snap) {
                clearTimeout(fallbackTimeout);
                var data = snap.val(), now = Date.now(), active = null;
                
                if(data) {
                    for(var id in data) {
                        if(data[id].device_id === DEVICE_ID) {
                            active = data[id];
                            break;
                        }
                    }
                }

                if(active && now < active.expireAt) {
                    isPremiumUser = true;
                    window.location.replace(MAIN_APP_URL + "?ads=false");
                } else {
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("gatewayContainer").style.display = "flex";
                }
            }).catch(function() {
                clearTimeout(fallbackTimeout);
                document.getElementById("loader").style.display = "none";
                document.getElementById("gatewayContainer").style.display = "flex";
            });

            document.getElementById("activateBtn").onclick = function() {
                var key = document.getElementById("activateKey").value.trim();
                if(!key) return;
                
                this.disabled = true; this.textContent = "Checking...";
                var self = this;

                db.ref("subscriptions").once("value").then(function(snap) {
                    var data = snap.val(), found = false;
                    if(data) {
                        for(var id in data) {
                            if(data[id].password === key) {
                                found = true;
                                if(data[id].used && data[id].device_id !== DEVICE_ID) {
                                    showPremiumAlert("Key already used!"); break;
                                }
                                db.ref("subscriptions/" + id).update({ used: true, device_id: DEVICE_ID }).then(function() {
                                    isPremiumUser = true;
                                    window.location.replace(MAIN_APP_URL + "?ads=false");
                                });
                                return;
                            }
                        }
                    }
                    if(!found) showPremiumAlert("Invalid Key!");
                    self.disabled = false; self.textContent = "Activate Now";
                }).catch(function() {
                    showPremiumAlert("Verification Error!");
                    self.disabled = false; self.textContent = "Activate Now";
                });
            };

        } catch (e) {
            clearTimeout(fallbackTimeout);
            document.getElementById("loader").style.display = "none";
            document.getElementById("gatewayContainer").style.display = "flex";
        }
    }

    window.onload = startSystem;
  </script>
</body>
</html>
