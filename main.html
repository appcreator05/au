<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie App Access</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
background:black;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
font-family:sans-serif;
color:white;
}
.container{
display:flex;
flex-direction:column;
gap:25px;
align-items:center;
}
.top-logo{
font-size:26px;
font-weight:bold;
}

.btn{
display:flex;
align-items:center;
justify-content:center;
width:260px;
height:60px;
border-radius:50px;
cursor:pointer;
color:white;
font-weight:bold;
}

.btn-purple{
background:linear-gradient(to right,#8a2be2,#f06292);
}
.btn-blue{
background:linear-gradient(to right,#2575fc,#00d2ff);
}

.sub-container{
display:none;
width:300px;
}

.gen-box{
background:#111;
padding:20px;
border-radius:15px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #444;
background:black;
color:white;
}

button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:linear-gradient(to right,#2575fc,#00d2ff);
color:white;
font-weight:bold;
cursor:pointer;
}

.alert{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.alert-box{
background:#222;
padding:20px;
border-radius:10px;
text-align:center;
}
</style>
</head>

<body>

<div class="container">
<div class="top-logo">Movie App</div>

<div class="btn btn-purple" onclick="goFree()">
Free Version
</div>

<div class="btn btn-blue" onclick="showPaid()">
Paid Version
</div>

<div id="paidBox" class="sub-container">
<div class="gen-box">
<p>Enter Subscription Key</p>
<input type="text" id="key">
<button onclick="checkKey()">Activate</button>
</div>
</div>

</div>

<div id="alert" class="alert">
<div class="alert-box">
<p id="alertMsg"></p>
<button onclick="closeAlert()">OK</button>
</div>
</div>

<script>

// ✅ IMPORTANT: Full URL use করা হয়েছে
const REDIRECT_URL = "https://appcreator05.github.io/au/index.html";

// Firebase Config
var firebaseConfig = {
apiKey: "AIzaSyCyDd6rCV7WaQe8sMF0Xmob3dpm6z6wEEQ",
authDomain: "myapps-4a8eb.firebaseapp.com",
databaseURL: "https://myapps-4a8eb-default-rtdb.firebaseio.com",
projectId: "myapps-4a8eb",
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// Device ID
function getDeviceId(){
let id = localStorage.getItem("device_id");
if(!id){
id = "dev_" + Math.random().toString(36).substr(2,10);
localStorage.setItem("device_id",id);
}
return id;
}
const DEVICE_ID = getDeviceId();

// ✅ Free Version (FIXED)
function goFree(){
window.location.replace("https://appcreator05.github.io/au/index.html");
}

// Show Paid Box
function showPaid(){
document.getElementById("paidBox").style.display="block";
}

// Alert
function showAlert(msg){
document.getElementById("alertMsg").innerText=msg;
document.getElementById("alert").style.display="flex";
}
function closeAlert(){
document.getElementById("alert").style.display="none";
}

// Check Key
function checkKey(){
let key = document.getElementById("key").value.trim();
if(!key) return;

db.ref("subscriptions").once("value").then(snap=>{
let data = snap.val() || {};
let found=false;

for(let id in data){
if(data[id].password === key){

if(data[id].used && data[id].device_id !== DEVICE_ID){
showAlert("Key already used!");
return;
}

db.ref("subscriptions/"+id).update({
used:true,
device_id:DEVICE_ID
}).then(()=>{
// ✅ Paid redirect FIXED
window.location.replace(REDIRECT_URL);
});

found=true;
break;
}
}

if(!found){
showAlert("Invalid Key!");
}

});
}
</script>

</body>
</html>
